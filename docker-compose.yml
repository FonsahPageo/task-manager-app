version: "3.9"

services:
  db:
    image: mysql:8.4
    container_name: taskmanager_db
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: root
      MYSQL_DATABASE: taskmanager
      TZ: UTC
    volumes:
      - db_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-proot"]
      interval: 10s
      timeout: 5s
      retries: 10

  backend:
    build: ./backend
    image: taskmanager-backend:latest
    container_name: taskmanager_backend
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      SPRING_PROFILES_ACTIVE: prod
      DB_URL: jdbc:mysql://db:3306/taskmanager?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC
      DB_USERNAME: root
      DB_PASSWORD: root
      JWT_SECRET: "bXktc3VwZXItc2VjcmV0LWtleS1mb3ItdGFzay1tYW5hZ2VyLWFwcGxpY2F0aW9uLTIwMjQtMDEtMDEh"
      JWT_EXPIRATION_MS: "86400000"
    ports:
      - "8080:8080"

  frontend:
    build:
      context: ./frontend
    image: taskmanager-frontend:latest
    container_name: taskmanager_frontend
    restart: unless-stopped
    depends_on:
      - backend
    ports:
      - "80:80"

volumes:
  db_data: